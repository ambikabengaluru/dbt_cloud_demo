version: 2

sources:
  - name: jaffle_shop
    loader: fivetran
    database: my_database
    schema: dbt_demo_3

    tables:
      - name: raw_orders
        config:
          freshness:
            warn_after:
              count: 6
              period: hour
            error_after:
              count: 12
              period: hour

      - name: raw_customers

